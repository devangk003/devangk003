  <style>
    .nm { font: 800 78px Inter, "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; letter-spacing: -2.6px; }
    .tg { font: 400 21px Inter, "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .lb { font: 500 11px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
    .mt { font: 400 12px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.4px; }

    .sw { animation: run 9s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes run {
      0%   { transform: translateX(-220px); }
      45%  { transform: translateX(928px); }
      100% { transform: translateX(928px); }
    }
    .s0 { animation-delay: 0.0s; } .s1 { animation-delay: 0.9s; } .s2 { animation-delay: 1.8s; }
    @media (prefers-reduced-motion: reduce) { .sw { animation: none; opacity: 0; } }
  </style>

