<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="Devang Kumawat. I design the interface and then ship it myself, in the same repo.">
  <defs>
    <pattern id="gridL" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#9a6b00" opacity="0.16"/>
    </pattern>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8860b"/>
      <stop offset="1" stop-color="#b8860b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="290" rx="10" fill="#ffffff"/>
  <rect width="1200" height="290" rx="10" fill="url(#gridL)"/>
  <rect x="0.5" y="0.5" width="1199" height="289" rx="10" fill="none" stroke="#d0d7de"/>

  <!-- node-graph motif: five tools into one agent, with the eval loop back -->
  <g transform="translate(830 46)">
    <g stroke="#d0d7de" stroke-width="1.5" fill="none">
      <path d="M60 100 L170 40"/>
      <path d="M60 100 L170 80"/>
      <path d="M60 100 L170 120"/>
      <path d="M60 100 L170 160"/>
      <path d="M60 100 L170 198"/>
    </g>
    <path d="M170 40 C 250 40 250 198 170 198" stroke="#b8860b" stroke-width="1.5" fill="none" stroke-dasharray="4 5" opacity="0.7"/>
    <circle cx="60" cy="100" r="13" fill="#b8860b"/>
    <circle cx="60" cy="100" r="24" fill="none" stroke="#b8860b" stroke-width="1.5" opacity="0.35"/>
    <g fill="#ffffff" stroke="#8c959f" stroke-width="1.5">
      <circle cx="170" cy="40" r="7"/>
      <circle cx="170" cy="80" r="7"/>
      <circle cx="170" cy="120" r="7"/>
      <circle cx="170" cy="160" r="7"/>
      <circle cx="170" cy="198" r="7"/>
    </g>
  </g>
  <rect x="700" y="0" width="499" height="289" fill="url(#fadeL)" opacity="0.55"/>

  <rect x="64" y="52" width="64" height="3" rx="1.5" fill="url(#ruleL)"/>

  <text x="64" y="126" fill="#1f2328" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.4">Devang Kumawat</text>

  <text x="64" y="170" fill="#424a53" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400">I design the interface and then ship it myself, in the same repo.</text>

  <text x="64" y="222" fill="#59636e" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="0.3">TypeScript &#183; React &#183; Next.js &#183; Python &#183; LangGraph &#183; Claude Code</text>

  <text x="64" y="252" fill="#818b98" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.3">Bengaluru, India</text>
</svg>
