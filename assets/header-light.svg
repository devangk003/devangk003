<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="412" viewBox="0 0 1200 412" role="img" aria-label="Devang Kumawat. I take a surface nobody owns and ship it end to end. DESIGN: Design systems v1 to v3. Brand books and launch campaigns. ENGINEERING: Frontend, agents, and the evaluation harnesses under them. DISTRIBUTION: 270k views on a channel I ran solo, at 18.">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6436A" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#0E9384" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#B77D18" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <style>
    .nm { font: 800 78px Inter, "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; letter-spacing: -2.6px; }
    .tg { font: 400 21px Inter, "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .lb { font: 600 11px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
    .pd { font: 400 14.5px Inter, "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .mt { font: 400 12px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.4px; }

    .pulse { opacity: 0; animation: bloom 6s ease-in-out infinite; }
    @keyframes bloom {
      0%, 70%, 100% { opacity: 0; transform: scale(0.5); }
      18%           { opacity: 0.22; transform: scale(1); }
    }
    .p0 { animation-delay: 0.0s; } .p1 { animation-delay: 1.3s; } .p2 { animation-delay: 2.6s; }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>

  <rect width="1200" height="412" rx="14" fill="#FBFBFD"/>
  <rect width="1200" height="412" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="411" rx="14" fill="none" stroke="#DFE3EE"/>

  <text class="nm" x="64" y="136" fill="#0B1020">Devang Kumawat</text>
  <text class="tg" x="64" y="184" fill="#5A6480">I take a surface nobody owns and ship it end to end.</text>
  <g transform="translate(64 236)"><rect x="0" y="0" width="344" height="108" rx="12" fill="#F3F4F9"/><rect x="0" y="0" width="344" height="108" rx="12" fill="none" stroke="#E3E6F0"/><rect x="22" y="24" width="12" height="12" rx="3.5" fill="#D6436A"/><text class="lb" x="44" y="34" fill="#D6436A">DESIGN</text><text class="pd" x="22" y="64" fill="#5A6480">Design systems v1 to v3.</text><text class="pd" x="22" y="86" fill="#5A6480">Brand books and launch campaigns.</text><circle class="pulse p0" cx="28" cy="30" r="16" fill="#D6436A"/></g><g transform="translate(428 236)"><rect x="0" y="0" width="344" height="108" rx="12" fill="#F3F4F9"/><rect x="0" y="0" width="344" height="108" rx="12" fill="none" stroke="#E3E6F0"/><rect x="22" y="24" width="12" height="12" rx="3.5" fill="#0E9384"/><text class="lb" x="44" y="34" fill="#0E9384">ENGINEERING</text><text class="pd" x="22" y="64" fill="#5A6480">Frontend, agents, and the</text><text class="pd" x="22" y="86" fill="#5A6480">evaluation harnesses under them.</text><circle class="pulse p1" cx="28" cy="30" r="16" fill="#0E9384"/></g><g transform="translate(792 236)"><rect x="0" y="0" width="344" height="108" rx="12" fill="#F3F4F9"/><rect x="0" y="0" width="344" height="108" rx="12" fill="none" stroke="#E3E6F0"/><rect x="22" y="24" width="12" height="12" rx="3.5" fill="#B77D18"/><text class="lb" x="44" y="34" fill="#B77D18">DISTRIBUTION</text><text class="pd" x="22" y="64" fill="#5A6480">270k views on a channel</text><text class="pd" x="22" y="86" fill="#5A6480">I ran solo, at 18.</text><circle class="pulse p2" cx="28" cy="30" r="16" fill="#B77D18"/></g>
  <text class="mt" x="64" y="382" fill="#8792AD">2026 Information Science graduate &#183; Bengaluru, India</text>
</svg>
