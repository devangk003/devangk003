<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="256" viewBox="0 0 1200 256" role="img" aria-label="Devang Kumawat. I design the interface and then ship it myself, in the same repo. TypeScript, React, Next.js, Python, LangGraph, Claude Code. Bengaluru, India.">
  <defs>
    <pattern id="gL" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#9a6b00" opacity="0.16"/>
    </pattern>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.60" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8860b"/>
      <stop offset="1" stop-color="#b8860b" stop-opacity="0"/>
    </linearGradient>
    <style>
      .n  { font: 700 52px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -1.3px; }
      .t  { font: 400 20px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m  { font: 400 14px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.3px; }
      .s  { font: 400 12px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.3px; }

      /* The dashes travel the loop, so the evaluation cycle reads as running.
         Nodes light in sequence: five tools called, then the result returns. */
      .loop  { animation: travel 5.5s linear infinite; }
      @keyframes travel { to { stroke-dashoffset: -180; } }

      .core  { animation: breathe 4s ease-in-out infinite; transform-origin: 60px 100px; }
      @keyframes breathe { 0%,100% { opacity:.35; transform:scale(1); } 50% { opacity:.7; transform:scale(1.06); } }

      .tool  { animation: call 5.5s ease-in-out infinite; }
      @keyframes call { 0%,72%,100% { opacity:.55; } 12% { opacity:1; } }
      .t1{animation-delay:0s}.t2{animation-delay:.28s}.t3{animation-delay:.56s}
      .t4{animation-delay:.84s}.t5{animation-delay:1.12s}

      @media (prefers-reduced-motion: reduce) {
        .loop, .core, .tool { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="256" rx="10" fill="#ffffff"/>
  <rect width="1200" height="256" rx="10" fill="url(#gL)"/>
  <rect x="0.5" y="0.5" width="1199" height="255" rx="10" fill="none" stroke="#d0d7de"/>

  <!-- five tools into one agent, with the evaluation loop back -->
  <g transform="translate(838 28)">
    <g stroke="#afb8c1" stroke-width="1.5" fill="none">
      <path d="M60 100 L170 40"/><path d="M60 100 L170 80"/><path d="M60 100 L170 120"/>
      <path d="M60 100 L170 160"/><path d="M60 100 L170 198"/>
    </g>
    <path d="M170 40 C 248 40 248 198 170 198" stroke="#b8860b" stroke-width="1.5" fill="none" stroke-dasharray="4 5" class="loop" opacity="0.7"/>
    <circle cx="60" cy="100" r="12" fill="#b8860b"/>
    <circle cx="60" cy="100" r="22" fill="none" stroke="#b8860b" stroke-width="1.5" opacity="0.35" class="core"/>
    <g fill="#ffffff" stroke="#8c959f" stroke-width="1.5">
      <circle cx="170" cy="40" r="6.5" class="tool t1"/><circle cx="170" cy="80" r="6.5" class="tool t2"/><circle cx="170" cy="120" r="6.5" class="tool t3"/>
      <circle cx="170" cy="160" r="6.5" class="tool t4"/><circle cx="170" cy="198" r="6.5" class="tool t5"/>
    </g>
  </g>
  <rect x="700" y="0" width="499" height="255" fill="url(#fadeL)" opacity="0.5"/>

  <rect x="64" y="48" width="56" height="3" rx="1.5" fill="url(#ruleL)"/>
  <text class="n" x="64" y="112" fill="#1f2328">Devang Kumawat</text>
  <text class="t" x="64" y="154" fill="#424a53">I design the interface and then ship it myself, in the same repo.</text>
  <text class="m" x="64" y="194" fill="#59636e">TypeScript &#183; React &#183; Next.js &#183; Python &#183; LangGraph &#183; Claude Code</text>
  <text class="s" x="64" y="218" fill="#818b98">Bengaluru, India</text>
</svg>
