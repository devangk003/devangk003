<svg xmlns="http://www.w3.org/2000/svg" width="640" height="286" viewBox="0 0 640 286" role="img" aria-label="Languages by bytes: TypeScript 66.1 percent, Python 12.5 percent, C# 11.5 percent, JavaScript 4.7 percent, HTML 2.0 percent, CSS 1.8 percent, Other 1.3 percent">
  <style>
    .ti { font: 500 11px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.4px; }
    .nm { font: 500 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .pc { font: 400 13px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .fn { font: 400 10.5px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }

    /* Motion here is additive only. Nothing on this card is revealed by an
       animation, because CSS animations do not advance in every context that
       renders an SVG through an img tag, and an entrance that hides its own
       content is one failed render away from a blank card.

       So the sheen is the only moving part. At frame 0 it sits off the left
       edge, which means the static render is the complete card. */
    .sheen { animation: sweep 7s cubic-bezier(.4,0,.2,1) 2s infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-260px); }
      55%  { transform: translateX(700px); }
      100% { transform: translateX(700px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .sheen { animation: none; }
    }
  </style>

  <rect width="640" height="286" rx="10" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="639" height="285" rx="10" fill="none" stroke="#d0d7de"/>

  <text class="ti" x="28" y="36" fill="#59636e">LANGUAGES</text>

  <defs>
    <clipPath id="clip"><rect x="28" y="60" width="584" height="18" rx="7.0"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="28" y="62" width="584" height="14" rx="7.0" fill="#eaeef2"/>
  <g clip-path="url(#clip)">
    <rect x="28.0" y="62" width="374.1" height="14" rx="7.0" fill="#3178c6"/><rect x="405.1" y="62" width="70.9" height="14" rx="7.0" fill="#3572A5"/><rect x="479.0" y="62" width="65.1" height="14" rx="7.0" fill="#178600"/><rect x="547.1" y="62" width="26.8" height="14" rx="7.0" fill="#f1e05a"/><rect x="576.9" y="62" width="11.5" height="14" rx="7.0" fill="#e34c26"/><rect x="591.4" y="62" width="10.1" height="14" rx="7.0" fill="#663399"/><rect x="604.5" y="62" width="7.5" height="14" rx="7.0" fill="#6e7681"/>
    <rect class="sheen" x="0" y="60" width="200" height="18" fill="url(#sheen)"/>
  </g>

  <g><circle cx="33" cy="111" r="5" fill="#3178c6"/><text class="nm" x="48" y="116" fill="#1f2328">TypeScript</text><text class="pc" x="300" y="116" fill="#59636e" text-anchor="end">66.1%</text></g><g><circle cx="33" cy="145" r="5" fill="#3572A5"/><text class="nm" x="48" y="150" fill="#1f2328">Python</text><text class="pc" x="300" y="150" fill="#59636e" text-anchor="end">12.5%</text></g><g><circle cx="33" cy="179" r="5" fill="#178600"/><text class="nm" x="48" y="184" fill="#1f2328">C#</text><text class="pc" x="300" y="184" fill="#59636e" text-anchor="end">11.5%</text></g><g><circle cx="33" cy="213" r="5" fill="#f1e05a"/><text class="nm" x="48" y="218" fill="#1f2328">JavaScript</text><text class="pc" x="300" y="218" fill="#59636e" text-anchor="end">4.7%</text></g><g><circle cx="341" cy="111" r="5" fill="#e34c26"/><text class="nm" x="356" y="116" fill="#1f2328">HTML</text><text class="pc" x="612" y="116" fill="#59636e" text-anchor="end">2.0%</text></g><g><circle cx="341" cy="145" r="5" fill="#663399"/><text class="nm" x="356" y="150" fill="#1f2328">CSS</text><text class="pc" x="612" y="150" fill="#59636e" text-anchor="end">1.8%</text></g><g><circle cx="341" cy="179" r="5" fill="#6e7681"/><text class="nm" x="356" y="184" fill="#1f2328">Other</text><text class="pc" x="612" y="184" fill="#59636e" text-anchor="end">1.3%</text></g>

  <text class="fn" x="28" y="264" fill="#818b98">Bytes across 14 public repos. Excludes a vendored 1.0 MB pdf.js worker.</text>
</svg>
